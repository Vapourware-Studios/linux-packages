name: Publish package repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: linux-package-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always deploy the current main record, including when an older release
      # event reaches this job late. Each record pins its own archive checksum.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read the bot's release record
        id: release
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          version = release.get('version') or ''
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'No package release has been published yet'
          assert release['archive'] == f'linux-packages-{version}.tar.gz'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\narchive={release["archive"]}\n')
          PY
      - name: Download signed repository archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir work
      - name: Verify and unpack the repository
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: python3 scripts/unpack_site.py "work/$ARCHIVE" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
